name: Build Intel preview DMG

on:
  push:
    branches: [build/intel-dmg, codex/macos-extensions-fonts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'mshanghai570/proliferate'
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      TARGET: x86_64-apple-darwin
      CARGO_BUILD_JOBS: "2"
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_PROLIFERATE_API_BASE_URL: http://127.0.0.1:8000
      VITE_PROLIFERATE_ENVIRONMENT: development
      VITE_REQUIRE_AUTH: "false"
      VITE_PROLIFERATE_DISABLE_CLOUD_COMPUTE: "1"
      APPLE_SIGNING_IDENTITY: "-"
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: intel-preview
          cache-on-failure: true
      - name: Check runtime architecture
        run: python3 scripts/check_anyharness_boundaries.py
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native runtime and helpers
        run: |
          cargo build --locked --release --target "$TARGET" \
            -p anyharness -p proliferate-worker -p proliferate-debug \
            -p proliferate-diagnostics-collector
          for binary in anyharness proliferate-worker proliferate-debug proliferate-diagnostics-collector; do
            test -x "target/$TARGET/release/$binary"
            lipo "target/$TARGET/release/$binary" -verify_arch x86_64
          done
          {
            echo "ANYHARNESS_BIN=$PWD/target/$TARGET/release/anyharness"
            echo "PROLIFERATE_WORKER_BIN=$PWD/target/$TARGET/release/proliferate-worker"
            echo "PROLIFERATE_DEBUG_BIN=$PWD/target/$TARGET/release/proliferate-debug"
            echo "PROLIFERATE_DIAGNOSTICS_COLLECTOR_BIN=$PWD/target/$TARGET/release/proliferate-diagnostics-collector"
          } >> "$GITHUB_ENV"
      - name: Generate runtime SDK
        env:
          SKIP_RUST: "1"
          ANYHARNESS_DEV_RUNTIME_BIN: ${{ github.workspace }}/target/x86_64-apple-darwin/release/anyharness
        run: pnpm --filter @anyharness/sdk generate
      - name: Save generated runtime contracts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-contract-sources
          path: |
            anyharness/sdk/generated/openapi.json
            anyharness/sdk/src/generated/openapi.ts
          retention-days: 3
      - name: Verify generated API compatibility
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const file = 'anyharness/sdk/generated/openapi.json';
          const before = JSON.parse(execFileSync('git', ['show', `HEAD:${file}`], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }));
          const after = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const [path, value] of Object.entries(before.paths)) assert.deepEqual(after.paths[path], value, path);
          for (const [name, value] of Object.entries(before.components.schemas)) assert.deepEqual(after.components.schemas[name], value, name);
          assert.deepEqual(after.info, before.info);
          assert.ok(after.paths['/v1/agent-auth/local-providers']);
          assert.ok(after.paths['/v1/agent-auth/local-providers/{id}']);
          assert.ok(after.paths['/v1/extensions/{namespace}/{name}/{version}/syntax-themes']);
          const ids = Object.values(after.paths).flatMap(path => Object.values(path).filter(value => value && typeof value === 'object' && value.operationId).map(value => value.operationId));
          assert.equal(new Set(ids).size, ids.length, 'operation IDs must be unique');
          JS
      - name: Build desktop web bundle
        working-directory: apps/desktop
        run: pnpm build
      - name: Check provider settings
        working-directory: apps/packages/product-client
        run: |
          pnpm exec vitest run --maxWorkers=1 --fileParallelism=false --testTimeout=20000 \
            src/lib/domain/settings/custom-provider-draft.test.ts \
            src/lib/domain/settings/navigation-presentation.test.ts \
            src/lib/domain/settings/navigation.test.ts \
            src/hooks/agents/workflows/use-custom-providers.test.tsx \
            src/hooks/agents/workflows/use-local-provider-editor.test.tsx \
            src/components/settings/panes/agents/harness/CustomProviderModal.test.tsx \
            src/components/settings/panes/agents/harness/CustomProvidersSection.test.tsx \
            src/components/settings/panes/agents/providers/LlmProvidersPane.test.tsx \
            src/components/extensions/marketplace/ExtensionMarketplaceScreen.test.tsx \
            src/components/extensions/marketplace/InstalledExtensions.test.tsx \
            src/components/extensions/marketplace/InstalledExtensionColors.test.tsx \
            src/components/extensions/marketplace/InstalledExtensionSyntax.test.tsx \
            src/lib/domain/preferences/imported-syntax-theme.test.ts \
            src/lib/infra/editor/highlighting.test.ts
      - name: Check native provider and encryption behavior
        run: |
          cargo test --locked --release --target "$TARGET" -p anyharness-lib --lib --features tokio/test-util local_provider -- --test-threads=1
          cargo test --locked --release --target "$TARGET" -p anyharness-lib --lib --features tokio/test-util mcp_bindings -- --test-threads=1
      - name: Check installed extension themes
        run: cargo test --locked --release --target "$TARGET" -p anyharness-lib --lib --features tokio/test-util extensions -- --test-threads=1
      - name: Check runtime SDK provider operations
        working-directory: anyharness/sdk
        run: pnpm exec vitest run src/client/agent-auth.test.ts src/client/extensions.test.ts --maxWorkers=1 --fileParallelism=false
      - name: Build bundled agents
        run: |
          command -v zstd >/dev/null || brew install zstd
          node scripts/build-agent-seed.mjs \
            --target "$TARGET" \
            --anyharness-bin "$ANYHARNESS_BIN" \
            --runtime-home "$RUNNER_TEMP/agent-seed-runtime" \
            --output-dir "$PWD/apps/desktop/src-tauri/agent-seeds"
          test -s "apps/desktop/src-tauri/agent-seeds/agent-seed-$TARGET.tar.zst"
          (cd apps/desktop/src-tauri/agent-seeds && shasum -a 256 -c "agent-seed-$TARGET.sha256")
      - name: Build preview app and DMG
        working-directory: apps/desktop
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          fs.writeFileSync('preview.config.json', JSON.stringify({
            build: { beforeBuildCommand: '' },
            productName: 'Proliferate Preview',
            identifier: 'com.mshanghai570.proliferate.preview',
            app: { windows: base.app.windows.map(window => ({ ...window, title: 'Proliferate Preview' })) },
            bundle: { createUpdaterArtifacts: false, macOS: { minimumSystemVersion: '15.0' } },
            plugins: { updater: { endpoints: [] }, 'deep-link': { desktop: { schemes: ['proliferate-preview'] } } },
          }));
          const cargo = fs.readFileSync('../../anyharness/crates/anyharness/Cargo.toml', 'utf8');
          const version = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!version) throw new Error('Missing runtime version');
          fs.writeFileSync('runtime-version.json', JSON.stringify({ anyharnessVersion: version }));
          JS
          pnpm tauri build --target "$TARGET" --bundles app,dmg --config preview.config.json
      - name: Verify app and DMG contents
        run: |
          app="target/$TARGET/release/bundle/macos/Proliferate Preview.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.mshanghai570.proliferate.preview
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 15.0
          for binary in proliferate anyharness proliferate-worker proliferate-debug proliferate-diagnostics-collector; do
            test -x "$app/Contents/MacOS/$binary"
            lipo "$app/Contents/MacOS/$binary" -verify_arch x86_64
            codesign --verify --strict "$app/Contents/MacOS/$binary"
          done
          test "$("$app/Contents/MacOS/proliferate-diagnostics-collector" --print-export-policy)" = lifecycle_only
          codesign --verify --deep --strict "$app"
          mkdir -p artifacts
          dmg_count=$(find "target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          test "$dmg_count" = 1
          cp "target/$TARGET/release/bundle/dmg/"*.dmg artifacts/Proliferate-Preview-intel.dmg
          hdiutil verify artifacts/Proliferate-Preview-intel.dmg
          mount_dir=$(mktemp -d)
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          hdiutil attach artifacts/Proliferate-Preview-intel.dmg -readonly -nobrowse -noautoopen -mountpoint "$mount_dir"
          test -d "$mount_dir/Proliferate Preview.app"
          test -L "$mount_dir/Applications"
          cmp "$app/Contents/MacOS/proliferate" "$mount_dir/Proliferate Preview.app/Contents/MacOS/proliferate"
          hdiutil detach "$mount_dir" -quiet
          trap - EXIT
          rmdir "$mount_dir"
          (cd artifacts && shasum -a 256 Proliferate-Preview-intel.dmg > SHA256SUMS)
          {
            echo 'Intel preview DMG: macOS 15+, ad-hoc signed, not notarized.'
            echo "Source: $GITHUB_SHA"
            echo 'Managed API: http://127.0.0.1:8000. Local API providers and project MCP settings use the bundled runtime.'
          } > artifacts/BUILD-INFO.txt
      - name: Upload Intel DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proliferate-preview-intel-dmg
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
