name: Build Intel DMG

on:
  push:
    branches: [build/intel-dmg]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'mshanghai570/proliferate'
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      TARGET: x86_64-apple-darwin
      CARGO_BUILD_JOBS: "2"
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_PROLIFERATE_API_BASE_URL: http://127.0.0.1:8000
      VITE_PROLIFERATE_ENVIRONMENT: development
      VITE_REQUIRE_AUTH: "true"
      VITE_EXTENSION_MARKETPLACE: "1"
      VITE_PROLIFERATE_DISABLE_CLOUD_COMPUTE: "1"
      APPLE_SIGNING_IDENTITY: "-"
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: intel-preview
          cache-on-failure: true
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native runtime and helpers
        run: |
          cargo build --locked --release --target "$TARGET" \
            -p anyharness -p proliferate-worker -p proliferate-debug \
            -p proliferate-diagnostics-collector
          for binary in anyharness proliferate-worker proliferate-debug proliferate-diagnostics-collector; do
            test -x "target/$TARGET/release/$binary"
            lipo "target/$TARGET/release/$binary" -verify_arch x86_64
          done
          {
            echo "ANYHARNESS_BIN=$PWD/target/$TARGET/release/anyharness"
            echo "PROLIFERATE_WORKER_BIN=$PWD/target/$TARGET/release/proliferate-worker"
            echo "PROLIFERATE_DEBUG_BIN=$PWD/target/$TARGET/release/proliferate-debug"
            echo "PROLIFERATE_DIAGNOSTICS_COLLECTOR_BIN=$PWD/target/$TARGET/release/proliferate-diagnostics-collector"
          } >> "$GITHUB_ENV"
      - name: Generate runtime SDK
        env:
          SKIP_RUST: "1"
          ANYHARNESS_DEV_RUNTIME_BIN: ${{ github.workspace }}/target/x86_64-apple-darwin/release/anyharness
        run: pnpm --filter @anyharness/sdk generate
      - name: Build bundled agents
        run: |
          command -v zstd >/dev/null || brew install zstd
          node scripts/build-agent-seed.mjs \
            --target "$TARGET" \
            --anyharness-bin "$ANYHARNESS_BIN" \
            --runtime-home "$RUNNER_TEMP/agent-seed-runtime" \
            --output-dir "$PWD/apps/desktop/src-tauri/agent-seeds"
          test -s "apps/desktop/src-tauri/agent-seeds/agent-seed-$TARGET.tar.zst"
          (cd apps/desktop/src-tauri/agent-seeds && shasum -a 256 -c "agent-seed-$TARGET.sha256")
      - name: Build app and DMG
        working-directory: apps/desktop
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          // Keep the product identity (name, bundle identifier, deep-link scheme)
          // and override only what an ad-hoc signed local build cannot have:
          // updater artifacts need a signing key, and the upstream update feed
          // must not receive this build.
          fs.writeFileSync('release.local.config.json', JSON.stringify({
            bundle: { createUpdaterArtifacts: false, macOS: { minimumSystemVersion: '15.0' } },
            plugins: { updater: { endpoints: [] } },
          }));
          const cargo = fs.readFileSync('../../anyharness/crates/anyharness/Cargo.toml', 'utf8');
          const version = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!version) throw new Error('Missing runtime version');
          fs.writeFileSync('runtime-version.json', JSON.stringify({ anyharnessVersion: version }));
          JS
          pnpm tauri build --target "$TARGET" --bundles app,dmg --config release.local.config.json
      - name: Verify app and DMG contents
        run: |
          app="target/$TARGET/release/bundle/macos/Proliferate.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.proliferate.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 15.0
          for binary in proliferate anyharness proliferate-worker proliferate-debug proliferate-diagnostics-collector; do
            test -x "$app/Contents/MacOS/$binary"
            lipo "$app/Contents/MacOS/$binary" -verify_arch x86_64
            codesign --verify --strict "$app/Contents/MacOS/$binary"
          done
          test "$("$app/Contents/MacOS/proliferate-diagnostics-collector" --print-export-policy)" = lifecycle_only
          codesign --verify --deep --strict "$app"
          mkdir -p artifacts
          dmg_count=$(find "target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          test "$dmg_count" = 1
          cp "target/$TARGET/release/bundle/dmg/"*.dmg artifacts/Proliferate-intel.dmg
          hdiutil verify artifacts/Proliferate-intel.dmg
          mount_dir=$(mktemp -d)
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          hdiutil attach artifacts/Proliferate-intel.dmg -readonly -nobrowse -noautoopen -mountpoint "$mount_dir"
          test -d "$mount_dir/Proliferate.app"
          test -L "$mount_dir/Applications"
          cmp "$app/Contents/MacOS/proliferate" "$mount_dir/Proliferate.app/Contents/MacOS/proliferate"
          hdiutil detach "$mount_dir" -quiet
          trap - EXIT
          rmdir "$mount_dir"
          (cd artifacts && shasum -a 256 Proliferate-intel.dmg > SHA256SUMS)
          {
            echo 'Intel DMG: macOS 15+, ad-hoc signed, not notarized, automatic updates disabled.'
            echo "Source: $GITHUB_SHA"
            echo 'Sign-in requires a control plane at http://127.0.0.1:8000; claim it at /setup before launching.'
            echo 'Extensions marketplace is enabled; installed packages stay inactive.'
          } > artifacts/BUILD-INFO.txt
      - name: Upload Intel DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proliferate-intel-dmg
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
